[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reits-weekly"
version = "0.1.0"
description = "Automated weekly report workflow for China public REITs"
requires-python = ">=3.11"
authors = [{ name = "周豪波", email = "963564360@qq.com" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
